name: Build Library

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v3
      with:
        node-version: '24'
    - run: npm ci
    - run: npm run build-browser
    - run: ls dist/browser.js  # Ensure the build file exists

  # Validates the npm-published half (ESM bundle + generated .d.ts), which the
  # CDN build above never exercises. Packs the real tarball and type-checks a
  # consumer against it, so a broken/missing export or type fails CI instead of
  # slipping into npm.
  verify-package:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - run: npm ci

    - name: Pack (runs prepack — type-check + ESM + UMD) and smoke-test a consumer
      run: |
        set -euo pipefail
        PKG=$(npm pack 2>/dev/null | tail -1)
        echo "packed: $PKG"
        DIR=$(mktemp -d)
        cd "$DIR"
        npm init -y >/dev/null
        npm install "$GITHUB_WORKSPACE/$PKG" typescript >/dev/null
        {
          echo "import SDK, { createButton, Chat, Messenger, version } from '@getchat-dev/web-button';"
          echo "import type { CreateButtonOptions } from '@getchat-dev/web-button';"
          echo "const opts: CreateButtonOptions = { uri: 'x' };"
          echo "void [SDK, createButton, Chat, Messenger, version, opts];"
        } > probe.ts
        npx tsc --noEmit --strict --moduleResolution bundler --module esnext --target ES2022 --lib ES2022,DOM probe.ts
        echo "OK: named + default exports and public types resolve from the tarball"

  # Publishes to npm only on push to main, and only when the version in
  # package.json is not already on the registry. Auth is via OIDC trusted
  # publishing (configured on npmjs.com) — no NPM_TOKEN secret, just the
  # id-token: write permission below and a recent npm (>= 11.5.1).
  publish:
    needs: [build, verify-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # mint the OIDC token npm trusted publishing verifies

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - name: Publish if package.json version is new
      run: |
        set -euo pipefail
        NAME=$(node -p "require('./package.json').name")
        VERSION=$(node -p "require('./package.json').version")
        if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
          echo "$NAME@$VERSION is already published — skipping"
        else
          echo "publishing $NAME@$VERSION"
          npm install -g npm@latest
          npm ci
          npm publish --access public
        fi

  # Sends exactly one Telegram message per run: success only when every stage
  # passed (reported once, at the end), failure if any stage failed or was
  # cancelled. Skipped stages (e.g. publish on a PR, or when the version is not
  # new) do not count as failure. Runs last, always.
  notify:
    needs: [build, verify-package, publish]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Notify Telegram
      env:
        BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: |
        set -euo pipefail
        if [ -z "${BOT}" ] || [ -z "${CHAT}" ]; then
          echo "Telegram secrets not set — skipping notification"
          exit 0
        fi
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        if [ "${FAILED}" = "true" ]; then
          ICON="❌"; STATUS="failed"
        else
          ICON="✅"; STATUS="passed"
        fi
        TEXT=$(printf '%s web-button CI %s\nbranch: %s\ncommit: %s\n%s' \
          "${ICON}" "${STATUS}" "${GITHUB_REF_NAME}" "${GITHUB_SHA:0:7}" "${RUN_URL}")
        curl -sS --fail -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
          --data-urlencode "chat_id=${CHAT}" \
          --data-urlencode "text=${TEXT}" \
          --data-urlencode "disable_web_page_preview=true" >/dev/null
        echo "sent: ${STATUS}"
